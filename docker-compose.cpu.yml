services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chart-patterns-cnn:latest
    container_name: chart-patterns-cnn
    working_dir: /workspace
    volumes:
      - ./:/workspace
    shm_size: "16gb"
    environment:
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: "Agg"
    ports:
      - "8888:8888"
    stdin_open: true
    tty: true
