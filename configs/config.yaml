# Shared single source of truth for reproducible runs.

project:
  name: candlestick-pattern-recognition      # Project identifier in logs/artifacts
  run_name: nq_sequence_baseline_15m_v1      # Experiment/run name
  seed: 42                                   # Random seed for reproducibility
  device: auto                               # auto | cpu | cuda

approach:
  primary_model_type: sequence               # sequence | image
  run_image_baseline: false                  # Keep false unless comparing with CNN

data_source:
  provider: csv                              # Data source type
  file_path: data/spy_1min_clean.csv         # SPY 1-min OHLCV data
  instrument: SPY                            # Instrument tag for metadata
  delimiter: ","                             # CSV delimiter
  has_header: true                           # CSV includes column header row

  timestamp:
    column: ts_event                         # Timestamp column in CSV
    timezone_in_data: UTC                    # Source timezone in file (+00:00)
    convert_to_timezone: America/New_York    # Working timezone used in pipeline
    sort_ascending: true                     # Ensure time order before processing

  columns:
    open: Open                               # Open price column
    high: High                               # High price column
    low: Low                                 # Low price column
    close: Close                             # Close price column
    volume: Volume                           # Volume column

  quality:
    drop_duplicates: true                    # Remove duplicate timestamps if any
    dropna_ohlcv: true                       # Drop rows with missing OHLCV values
    enforce_numeric_ohlcv: true              # Cast and validate OHLCV as numeric
    expected_base_frequency: 1min           # Expected source granularity
    allow_market_close_gap: true             # Keep known session close gaps
    market_close_gap_minutes: 60             # Expected close gap duration

resampling:
  base_timeframe: 1min                       # Input granularity from source data
  target_timeframe: 15min                    # Training granularity (15-minute)
  drop_incomplete_bars: true                 # Drop partial bars at boundaries
  ohlcv_agg:
    open: first                              # Standard OHLCV resample rule
    high: max
    low: min
    close: last
    volume: sum

windowing:
  lookback_bars: 80                          # Bars included in each sample window
  stride: 1                                  # Sliding-window step

labeling:
  schema_version: 2                          # Strict academic labeling schema
  active_pattern: head_shoulders             # head_shoulders | inverse_head_shoulders | double_top | double_bottom
  strategy: one_vs_rest_binary               # Separate binary model per active pattern

  classes:
    positive_label: 1
    negative_label: 0
    positive_name: positive
    negative_name: other

  extrema_detection:
    method: nadaraya_watson                  # Nonparametric smoothing before extrema extraction
    price_field: close
    smoothing:
      kernel: gaussian
      bandwidth:
        selection_method: aicc               # Data-driven bandwidth selection
        lookback_bars: 120
        min_bandwidth: 6.0
        max_bandwidth: 26.0
    extrema_validation:
      derivative_method: central_difference
      zero_crossing_epsilon: 1.0e-6
      min_second_derivative_abs: 1.0e-7
      enforce_alternation: true
      min_extrema_separation_bars: 2

  confirmation:
    breakout_confirmation_pct: 0.005         # 0.5%: close above neckline by 0.5%
    confirm_break_within_bars: 50            # 50 bars = ~12hrs: multi-day patterns need more confirmation time
    breakout_volume_average_bars: 20

  labeling_policy:
    positive_event: confirmed_breakout_only
    window_anchor: breakout_bar
    hard_negative_sampling:
      enabled: true
      include_partial_patterns: true
      include_failed_breakouts: true
      target_positive_to_negative_ratio: "1:3"

  head_shoulders:
    geometry:
      shoulder_symmetry_tolerance_pct: 0.07   # 7%: NQ 15min shoulders rarely symmetric to <4%
      neckline_point_symmetry_tolerance_pct: 0.07
      min_peak_separation_bars: 5
      max_peak_separation_bars: 120           # ~30hrs: NQ near-24hr trading
      neckline_max_slope: 0.15
    structure:
      require_e1_peak_e2_trough_e3_peak_e4_trough_e5_peak: true
      require_head_above_shoulders: true
    volume_rules:
      required: false                         # Disabled: strict V_E1>V_E3>V_E5 leaves <30 samples on NQ 15min
      require_peak_volume_decay: true
      peak_volume_order: V_E1_gt_V_E3_gt_V_E5
      breakout_volume_min_multiplier: 1.2

  inverse_head_shoulders:
    geometry:
      shoulder_symmetry_tolerance_pct: 0.07   # 7%: consistent with H&S calibration
      neckline_point_symmetry_tolerance_pct: 0.07
      min_trough_separation_bars: 5
      max_trough_separation_bars: 120         # ~30hrs: NQ near-24hr trading
      neckline_max_slope: 0.15
    structure:
      require_e1_trough_e2_peak_e3_trough_e4_peak_e5_trough: true
      require_head_below_shoulders: true
    volume_rules:
      required: true
      require_peak_volume_decay: true
      peak_volume_order: V_E2_gt_V_E4
      breakout_volume_min_multiplier: 1.2

  double_top:
    geometry:
      peak_tolerance_pct: 0.040              # 4%: matches double_bottom trough tolerance for NQ
      min_pullback_pct: 0.003                # 0.3%: NQ 15min intraday pullback threshold
      prior_trend_pct: 0.005                 # 0.5%: prior rise before first peak
      min_separation_bars: 5
      max_separation_bars: 200               # ~50hrs: NQ near-24hr trading, patterns span multiple days
    structure:
      require_e1_peak_e2_trough_e3_peak: true
    volume_rules:
      required: true
      require_first_peak_volume_greater_than_second: true
      breakout_volume_min_multiplier: 1.2

  double_bottom:
    geometry:
      trough_tolerance_pct: 0.040        # 4%: smoothed 15min troughs on NQ have low amplitude
      min_bounce_pct: 0.003              # 0.3%: NQ 15min intraday bounce threshold
      prior_trend_pct: 0.005             # 0.5%: prior drop before first trough
      min_separation_bars: 5
      max_separation_bars: 200           # ~50hrs: NQ near-24hr trading, patterns span multiple days
    structure:
      require_e1_trough_e2_peak_e3_trough: true
    volume_rules:
      required: true
      require_first_trough_volume_greater_than_second: true
      breakout_volume_min_multiplier: 1.5

model:
  input_type: sequence                       # sequence | image
  architecture: tcn                          # For sequence mode: tcn | lstm | transformer
  image_backbone: resnet18                   # Used only if input_type=image
  pretrained_image_backbone: true            # Used only for image backbone
  num_classes: 2                             # Binary: pattern vs other (see labeling.active_pattern)
  dropout: 0.2                               # Classifier dropout
  tcn:
    num_channels: [32, 64, 64]              # Channel sizes per TCN layer (3 layers)
    kernel_size: 3                           # Convolution kernel size
    input_features: 5                        # OHLCV = 5 input features

training:
  batch_size: 64                             # Samples per gradient step
  epochs: 60                                 # Maximum number of training epochs
  mixed_precision: true                      # AMP training for speed/memory
  early_stopping_patience: 10               # Stop if metric does not improve
  class_weight_negative: 1.0                # Loss weight for negative class
  class_weight_positive: auto               # Auto-balance rare positives when training on all rolling anchors

augmentation:
  enabled: true                             # Toggle augmentation on/off
  n_copies_per_positive: 2                 # 75 -> 225 positives, 216 negatives -> ~51% positive rate
  gaussian_noise_std: 0.012                # Std of full-feature Gaussian noise
  price_coherent_noise_std: 0.008          # Coherent noise added to OHLC together
  volume_jitter_range: 0.12               # Volume scaled by Uniform(-range, +range)

optimizer:
  name: adamw                                # Optimizer type
  lr: 0.0002                                 # Learning rate
  weight_decay: 0.001                        # L2 regularization strength

evaluation:
  split_method: time                         # Use time-based split to reduce leakage
  train_ratio: 0.70                          # Train split ratio
  val_ratio: 0.15                            # Validation split ratio
  test_ratio: 0.15                           # Test split ratio
  metrics:                                   # Reported metrics
    - accuracy
    - precision_macro
    - recall_macro
    - f1_macro

product:
  purged_split:
    enabled: true
    embargo_bars: 80

  stage1:
    threshold_search:
      min: 0.20
      max: 0.90
      num: 29
      precision_floor: 0.35

  stage2:
    model:
      type: logistic_regression
      c: 1.0
      max_iter: 2000
      solver: lbfgs
      class_weight: balanced

    trade_labeling:
      horizon_bars: 16
      take_profit_pct: 0.010
      stop_loss_pct: 0.0075
      min_net_return_pct: 0.0
      round_trip_cost_bps: 4.0
      same_bar_exit_priority: stop

    threshold_search:
      min: 0.20
      max: 0.90
      num: 29
      precision_floor: 0.55
      min_trades: 5

  replay:
    bars: 96
    starting_capital: 100000.0
    size_per_trade_usd: 10000.0
    max_open_positions: 1

chart_images:
  enabled: false                             # true only when training image models
  width_px: 224                              # Chart image width
  height_px: 224                             # Chart image height
  candles_per_image: 80                      # Candles rendered per sample image
  show_volume: true                          # Include volume panel in rendered chart
  output_format: png                         # Saved image format

paths:
  outputs_root: outputs                      # Root directory for all run artifacts
  checkpoints_dir: outputs/checkpoints       # Model checkpoints
  metrics_dir: outputs/metrics               # Metrics and reports
