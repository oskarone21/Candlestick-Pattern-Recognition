# Shared single source of truth for reproducible runs.

project:
  name: candlestick-pattern-recognition
  run_name: spy_15m_kaggle_suite_v1
  seed: 42
  device: auto                              # auto | cpu | cuda

approach:
  primary_model_type: sequence
  run_image_baseline: false

# -----------------------------
# Data source and preprocessing
# -----------------------------
data_source:
  provider: kagglehub
  kaggle_dataset: gratefuldata/intraday-stock-data-1-min-sp-500-200821
  kaggle_file_path: 1_min_SPY_2008-2021.csv # Verified Kaggle file name for this dataset
  kaggle_pandas_kwargs: {}

  instrument: SPY

  timestamp:
    column: date
    timezone_in_data: America/Denver        # Inferred from session coverage; converts to full 09:30-16:00 ET
    convert_to_timezone: America/New_York
    sort_ascending: true

  columns:
    symbol: symbol
    open: open
    high: high
    low: low
    close: close
    volume: volume

  quality:
    drop_duplicates: true
    dropna_ohlcv: true
    enforce_numeric_ohlcv: true

  session:
    regular_session_only: true
    calendar: XNYS
    start: "09:30"
    end: "16:00"
    early_close_end: "13:00"
    keep_official_early_closes: true
    drop_anomalous_partial_days: true

resampling:
  base_timeframe: 1min
  target_timeframe: 15min
  drop_incomplete_bars: true
  ohlcv_agg:
    open: first
    high: max
    low: min
    close: last
    volume: sum

windowing:
  lookback_bars: 80
  stride: 1

# -----------------------------
# Labeling (schema v2)
# -----------------------------
labeling:
  schema_version: 2
  allowed_patterns:
    - head_shoulders
    - inverse_head_shoulders
    - double_top
    - double_bottom
  active_pattern: head_shoulders
  strategy: one_vs_rest_binary

  classes:
    positive_label: 1
    negative_label: 0
    positive_name: positive
    negative_name: other

  extrema_detection:
    method: nadaraya_watson
    price_field: close
    smoothing:
      kernel: gaussian
      causal: true                           # trailing-only smoothing to avoid future-bar leakage
      bandwidth:
        selection_method: aicc
        lookback_bars: 120
        min_bandwidth: 2.0
        max_bandwidth: 30.0
        default_bandwidth: 7.0
    extrema_validation:
      derivative_method: central_difference
      causal: true                           # one-bar delayed causal extrema confirmation
      zero_crossing_epsilon: 1.0e-6
      min_second_derivative_abs: 1.0e-7
      enforce_alternation: true
      min_extrema_separation_bars: 2

  confirmation:
    breakout_confirmation_pct: 0.04
    confirm_break_within_bars: 8
    breakout_volume_average_bars: 20

  labeling_policy:
    positive_event: confirmed_breakout_only
    window_anchor: breakout_bar
    hard_negative_sampling:
      enabled: true
      include_partial_patterns: true
      include_failed_breakouts: true
      target_positive_to_negative_ratio: "1:3"

  head_shoulders:
    geometry:
      shoulder_symmetry_tolerance_pct: 0.015
      neckline_point_symmetry_tolerance_pct: 0.015
      min_peak_separation_bars: 5
      max_peak_separation_bars: 40
      neckline_max_slope: 0.15
    structure:
      require_e1_peak_e2_trough_e3_peak_e4_trough_e5_peak: true
      require_head_above_shoulders: true
    volume_rules:
      required: true
      require_peak_volume_decay: true
      peak_volume_order: V_E1_gt_V_E3_gt_V_E5
      breakout_volume_min_multiplier: 1.2

  inverse_head_shoulders:
    geometry:
      shoulder_symmetry_tolerance_pct: 0.015
      neckline_point_symmetry_tolerance_pct: 0.015
      min_trough_separation_bars: 5
      max_trough_separation_bars: 40
      neckline_max_slope: 0.15
    structure:
      require_e1_trough_e2_peak_e3_trough_e4_peak_e5_trough: true
      require_head_below_shoulders: true
    volume_rules:
      required: true
      require_peak_volume_decay: true
      peak_volume_order: V_E2_gt_V_E4
      breakout_volume_min_multiplier: 1.2

  double_top:
    geometry:
      peak_tolerance_pct: 0.025
      min_pullback_pct: 0.05
      prior_trend_pct: 0.15
      min_separation_bars: 5
      max_separation_bars: 50
    structure:
      require_e1_peak_e2_trough_e3_peak: true
    volume_rules:
      required: true
      require_first_peak_volume_greater_than_second: true
      breakout_volume_min_multiplier: 1.2

  double_bottom:
    geometry:
      trough_tolerance_pct: 0.025
      min_bounce_pct: 0.05
      prior_trend_pct: 0.15
      min_separation_bars: 5
      max_separation_bars: 50
    structure:
      require_e1_trough_e2_peak_e3_trough: true
    volume_rules:
      required: true
      require_first_trough_volume_greater_than_second: true
      breakout_volume_min_multiplier: 1.5

# -----------------------------
# Models and training
# -----------------------------
model:
  input_type: sequence
  architecture: tcn
  image_backbone: resnet18
  pretrained_image_backbone: true
  num_classes: 2
  sequence_normalization_mode: window_minmax  # SWAPPED to window_minmax to prevent absolute price drift
  dropout: 0.2

model_selection:
  candidate_models:
    - logreg
    - lstm
    - tcn
  primary_selection_metric: f2
  precision_floor: 0.50
  recall_floor: 0.0
  use_conservative_selection_scores: true
  minimum_predicted_positive_support: 0
  minimum_true_positive_support: 0

training:
  batch_size: 64
  epochs: 50
  mixed_precision: true
  early_stopping_patience: 8
  num_workers: 0
  persistent_workers: false
  augmentation:
    enabled: false
    n_copies_per_positive: 2
    gaussian_noise_std: 0.012
    price_coherent_noise_std: 0.008
    volume_jitter_range: 0.12

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.0001

evaluation:
  split_method: time
  train_ratio: 0.60
  val_ratio: 0.20
  test_ratio: 0.20
  embargo_bars: 88                        # lookback + confirmation horizon
  enforce_min_embargo: true               # guards against train/val/test overlap leakage
  allow_zero_embargo_fallback: false      # fail fast instead of silently dropping purge gap
  minimum_validation_positive_support: 5  # champion selection support gate (validation-driven)
  minimum_test_positive_support: 5
  allow_low_support_champion_fallback: false
  bootstrap_iterations: 300
  threshold_grid_size: 181
  metrics:
    - precision
    - recall
    - f1
    - f2
    - pr_auc

optuna:
  enabled: true
  tuned_models:
    - lstm
    - tcn
  n_trials: 24
  timeout_hours: 10
  epochs_per_trial: 10
  storage_path: outputs/optuna/studies.db

# -----------------------------
# Backtest and visual verification
# -----------------------------
backtest:
  entry_rule: next_bar_open
  tp_rule: r_multiple
  tp_secondary_rule: nearest_swing
  sl_rule: risk_based_pattern_invalidation
  capital_base: 1000000
  sizing_mode: risk_based
  risk_per_trade_bps: 25
  max_portfolio_heat_bps: 100
  max_open_positions: 4
  allow_same_pattern_overlap: false
  target_r_multiple: 1.5
  stop_atr_multiple: 1.0
  min_stop_distance_bps: 5
  max_gross_exposure_multiple: 1.0
  time_stop_bars: 26
  transaction_cost_bps_per_side: 1
  slippage_bps_per_side: 0.5

chart_images:
  enabled: true
  width_px: 1280
  height_px: 720
  candles_per_image: 80
  show_volume: true
  output_format: png
  gallery_lookforward_bars: 20
  gallery_max_per_bucket: 12

paths:
  raw_1m_path: data/raw/spy_1m.csv
  cleaned_1m_path: data/processed/spy_1m_cleaned.csv
  processed_15m_path: data/processed/spy_15m.csv
  outputs_root: outputs
  checkpoints_dir: outputs/checkpoints
  metrics_dir: outputs/metrics
  datasets_dir: outputs/datasets
  backtest_dir: outputs/backtest
  gallery_dir: outputs/gallery
  timezone_report: outputs/data_quality/timezone_report.json
  raw_1m_quality_report: outputs/data_quality/raw_1m_quality_report.json
  session_coverage_report: outputs/data_quality/session_coverage_report.csv
  data_quality_report: outputs/data_quality/prep_quality_report.json
